name: Generate Port
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "Download link"
        required: true
      patch:
        description: "Patch"
        required: true
      run_id:
        description: "Correlation id sent by the website"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Download source APK
        run: curl -L --fail "${{ inputs.apk_link }}" -o input.apk

      - name: Run port
        run: bash build_port.sh input.apk "${{ inputs.patch }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}
          path: /home/runner/work/AppsPorter/AppsPorter/out/input_ported.apk
          retention-days: 1
          if-no-files-found: error
