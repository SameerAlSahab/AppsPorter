
name: Generate Port
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "Download link"
        required: true
        type: string
      patch:
        description: "Patch"
        required: true
        type: string
      run_id:
        description: "Correlation id sent by the website"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Download source APK
        env:
          APK_LINK: ${{ inputs.apk_link }}
        run: |
          curl -fL --retry 3 "$APK_LINK" -o input.apk
          test -s input.apk

      - name: Run port
        env:
          PATCH_NAME: ${{ inputs.patch }}
        run: |
          bash build_port.sh input.apk "$PATCH_NAME"

      - name: Verify APK output
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Searching for generated APK files..."
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          APK_PATH="$GITHUB_WORKSPACE/out/input_ported.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Ported APK not found or empty: $APK_PATH"
            exit 1
          fi

          echo "APK verified successfully."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.run_id }}
        run: |
          APK_PATH="$GITHUB_WORKSPACE/out/input_ported.apk"
          TAG="port-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "Generated automatically by GitHub Actions.

          Run ID: ${GITHUB_RUN_ID}
          Attempt: ${GITHUB_RUN_ATTEMPT}" \
            --latest=false

          echo "Release created successfully."
          echo "Tag: $TAG"
